<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Story reflection card frame</title>
  <desc id="desc">A rounded indigo card frame with placeholders for a symbol, family, title, image, and prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171A36"/>
      <stop offset="1" stop-color="#544A8F"/>
    </linearGradient>
  </defs>
  <rect x="18" y="18" width="764" height="1164" rx="48" fill="url(#bg)"/>
  <rect x="50" y="50" width="700" height="1100" rx="32" fill="none" stroke="#F2D79C" stroke-width="3"/>
  <text x="82" y="120" fill="#F2D79C" font-size="42" font-family="sans-serif">{{SYMBOL}}</text>
  <text x="718" y="114" fill="#F2D79C" font-size="22" text-anchor="end" font-family="sans-serif">{{FAMILY}}</text>
  <rect x="82" y="165" width="636" height="560" rx="24" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="400" y="800" fill="#FFFFFF" font-size="48" text-anchor="middle" font-family="sans-serif">{{TITLE}}</text>
  <line x1="180" y1="845" x2="620" y2="845" stroke="#F2D79C" stroke-width="2"/>
  <text x="400" y="920" fill="#F7F4ED" font-size="28" text-anchor="middle" font-family="sans-serif">{{PROMPT}}</text>
  <text x="400" y="1090" fill="#D9D5EA" font-size="20" text-anchor="middle" font-family="sans-serif">回答 · 接着编 · 轻一点 · 换一张 · 跳过 · 结束</text>
</svg>
